<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FDC packed-column PFD (revised)</title>
  <defs>
    <marker id="arrO" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8943a"/></marker>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
    <marker id="arrC" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17a2b8"/></marker>
    <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
    <pattern id="insul" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1ece0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc6ae" stroke-width="2"/></pattern>
    <style>
      .t{fill:#222} .lbl{font-size:12px;fill:#222} .tag{font-size:11px;font-weight:bold;fill:#7a1f1f}
      .glass{fill:#fff;stroke:#555;stroke-width:1.6} .box{fill:#fff;stroke:#555;stroke-width:1.2}
      .vap{stroke:#e8943a;stroke-width:2.5;fill:none} .liq{stroke:#2f6db5;stroke-width:2.5;fill:none}
      .cw{stroke:#17a2b8;stroke-width:2.5;fill:none} .vac{stroke:#777;stroke-width:2.5;fill:none;stroke-dasharray:7 4}
      .sig{stroke:#7a1f1f;stroke-width:1;fill:none;stroke-dasharray:3 3} .sen{fill:#fff;stroke:#7a1f1f;stroke-width:1.4}
    </style>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" class="t">Packed-column batch fractionation of WPPO - revised PFD</text>

  <!-- ===== Heating mantle + stirrer ===== -->
  <path d="M135,640 Q135,560 260,560 Q385,560 385,640 L385,668 L135,668 Z" fill="#f4cccc" stroke="#555" stroke-width="1.4"/>
  <text x="260" y="656" text-anchor="middle" class="lbl">Heating mantle + magnetic stirrer</text>
  <rect x="385" y="598" width="14" height="24" class="sen"/><line x1="399" y1="610" x2="440" y2="610" class="sig"/>
  <text x="444" y="606" class="tag">TSH-101</text><text x="444" y="620" class="lbl">mantle high-T cut-out</text>

  <!-- ===== Round-bottom flask (pot) ===== -->
  <circle cx="260" cy="480" r="100" class="glass"/>
  <path d="M164,500 A100,100 0 0 0 356,500 Z" fill="#3a3a3a"/>
  <ellipse cx="240" cy="572" rx="14" ry="4" fill="#fff" stroke="#555"/>
  <text x="285" y="540" text-anchor="middle" fill="#fff" font-size="13">WPPO charge</text>
  <line x1="290" y1="490" x2="290" y2="448" class="vap" marker-end="url(#arrO)"/>
  <line x1="320" y1="490" x2="320" y2="458" class="vap" marker-end="url(#arrO)"/>
  <line x1="260" y1="490" x2="260" y2="440" class="vap" marker-end="url(#arrO)"/>
  <rect x="244" y="372" width="32" height="12" class="glass"/>
  <!-- side neck with liquid thermocouple (tip below liquid line) -->
  <polygon points="192,418 205,408 232,440 219,450" class="glass"/>
  <line x1="196" y1="414" x2="232" y2="518" stroke="#7a1f1f" stroke-width="2"/>
  <circle cx="232" cy="518" r="4" class="sen"/>
  <text x="20" y="400" class="tag">TT-101</text><text x="20" y="414" class="lbl">Pot liquid T</text>
  <text x="20" y="428" class="lbl">(tip stays immersed)</text>
  <line x1="140" y1="418" x2="193" y2="418" class="sig"/>
  <!-- pot pressure tap -->
  <line x1="276" y1="378" x2="330" y2="378" class="sig"/>
  <circle cx="338" cy="378" r="9" class="sen"/><text x="338" y="382" text-anchor="middle" font-size="10" class="tag">P</text>
  <text x="352" y="374" class="tag">PT-102</text><text x="352" y="388" class="lbl">Pot pressure</text>

  <!-- ===== Column with insulation ===== -->
  <rect x="226" y="120" width="68" height="254" fill="url(#insul)" stroke="#a89f86"/>
  <text x="222" y="190" text-anchor="end" class="lbl" fill="#6b6247">Insulation (wrap / jacket)</text>
  <line x1="226" y1="186" x2="232" y2="186" class="sig"/>
  <rect x="244" y="120" width="32" height="254" class="glass"/>
  <!-- packed bed -->
  <rect x="245" y="210" width="30" height="130" fill="#e9eef3"/>
  <g fill="#fff" stroke="#666" stroke-width="1">
    <circle cx="252" cy="218" r="5"/><circle cx="264" cy="220" r="5"/><circle cx="256" cy="230" r="5"/><circle cx="268" cy="234" r="5"/>
    <circle cx="252" cy="244" r="5"/><circle cx="264" cy="248" r="5"/><circle cx="256" cy="258" r="5"/><circle cx="268" cy="262" r="5"/>
    <circle cx="252" cy="272" r="5"/><circle cx="264" cy="276" r="5"/><circle cx="256" cy="286" r="5"/><circle cx="268" cy="290" r="5"/>
    <circle cx="252" cy="300" r="5"/><circle cx="264" cy="304" r="5"/><circle cx="256" cy="314" r="5"/><circle cx="268" cy="318" r="5"/>
    <circle cx="252" cy="330" r="5"/><circle cx="266" cy="332" r="5"/>
  </g>
  <line x1="245" y1="209" x2="275" y2="209" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 2"/>
  <line x1="245" y1="341" x2="275" y2="341" stroke="#c0392b" stroke-width="3"/>
  <text x="20" y="234" class="lbl">Retaining plug (top)</text><line x1="140" y1="230" x2="244" y2="210" class="sig"/>
  <text x="20" y="345" class="lbl">Bed support / constriction</text><line x1="168" y1="341" x2="244" y2="341" class="sig"/>
  <text x="20" y="276" class="lbl" font-weight="bold">Packed bed</text>
  <text x="20" y="290" class="lbl">(glass beads or stainless wool)</text>
  <text x="20" y="304" class="lbl">height H_pack, scaled in app</text>
  <!-- vapour rising through column -->
  <line x1="268" y1="362" x2="268" y2="346" class="vap" marker-end="url(#arrO)"/>
  <line x1="268" y1="205" x2="268" y2="128" class="vap" marker-end="url(#arrO)"/>

  <!-- ===== Reflux head (liquid-dividing) ===== -->
  <rect x="216" y="58" width="88" height="62" class="glass"/>
  <path d="M224,80 q6,-9 12,0 t12,0 t12,0 t12,0 t12,0 t8,0" fill="none" stroke="#17a2b8" stroke-width="2.5"/>
  <text x="20" y="62" class="lbl" font-weight="bold">Head condenser</text><line x1="115" y1="58" x2="224" y2="76" class="sig"/>
  <!-- head coolant connections to bath -->
  <path d="M304,72 L620,72" class="cw" marker-end="url(#arrC)"/>
  <path d="M620,100 L304,100" class="cw" marker-end="url(#arrC)"/>
  <text x="440" y="66" class="lbl" fill="#17a2b8">coolant out</text>
  <text x="440" y="94" class="lbl" fill="#17a2b8">coolant in</text>
  <!-- vapour thermocouple: bulb at the vapour inlet to the head -->
  <line x1="244" y1="40" x2="244" y2="110" stroke="#7a1f1f" stroke-width="2"/>
  <circle cx="244" cy="110" r="4" class="sen"/>
  <text x="20" y="104" class="tag">TT-102</text><text x="20" y="118" class="lbl">Head vapour T</text>
  <line x1="100" y1="112" x2="238" y2="111" class="sig"/>
  <!-- head pressure tap -->
  <line x1="304" y1="116" x2="470" y2="116" class="sig"/>
  <circle cx="478" cy="116" r="9" class="sen"/><text x="478" y="120" text-anchor="middle" font-size="10" class="tag">P</text>
  <text x="492" y="112" class="tag">PT-101</text><text x="492" y="126" class="lbl">Top pressure, P_top</text>
  <!-- condensate to splitter -->
  <path d="M304,120 L330,120 L330,124" class="liq"/>
  <circle cx="330" cy="134" r="10" class="sen"/><line x1="323" y1="141" x2="337" y2="127" stroke="#7a1f1f" stroke-width="1.6"/>
  <!-- reflux return to column top -->
  <path d="M330,144 L330,196 L280,196" class="liq" stroke-dasharray="5 3" marker-end="url(#arrB)"/>
  <text x="300" y="214" class="lbl" fill="#2f6db5">reflux return</text>
  <!-- take-off to product cooler -->
  <path d="M340,134 L410,134 L410,178" class="liq" marker-end="url(#arrB)"/>
  <text x="346" y="128" class="lbl" fill="#2f6db5">take-off</text>
  <text x="422" y="148" class="tag">RC-101</text><text x="422" y="161" class="lbl">Reflux splitter, sets R</text>
  <text x="422" y="174" class="lbl">(solenoid, timed)</text>
  <line x1="420" y1="146" x2="344" y2="136" class="sig"/>

  <!-- ===== Product cooler (inclined, lower end at the receiver) ===== -->
  <g transform="rotate(14 400 200)">
    <rect x="390" y="181" width="210" height="38" rx="6" class="glass"/>
    <path d="M400,200 q10,-16 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#17a2b8" stroke-width="2.5"/>
  </g>
  <text x="400" y="272" class="lbl" font-weight="bold">Product cooler (inclined)</text>

  <!-- ===== Coolant circulator ===== -->
  <rect x="620" y="55" width="140" height="60" class="box"/>
  <text x="690" y="80" text-anchor="middle" class="lbl">Circulating bath</text>
  <text x="690" y="96" text-anchor="middle" class="lbl">(T-controlled, feeds both</text>
  <text x="690" y="110" text-anchor="middle" class="lbl" font-size="11">condensers)</text>
  <!-- cooler IN at lower end, OUT at upper end -->
  <path d="M740,115 L740,262 L608,262" class="cw" marker-end="url(#arrC)"/>
  <text x="640" y="280" class="lbl" fill="#17a2b8">coolant IN (lower end)</text>
  <path d="M540,212 L540,190 L660,190 L660,115" class="cw" marker-end="url(#arrC)"/>
  <text x="666" y="150" class="lbl" fill="#17a2b8">coolant OUT</text><text x="666" y="164" class="lbl" fill="#17a2b8">(upper end)</text>

  <!-- ===== Multi-flask receiver ===== -->
  <path d="M595,258 L595,322" class="liq" marker-end="url(#arrB)" stroke-dasharray="none"/>
  <rect x="520" y="322" width="190" height="22" class="glass"/>
  <text x="615" y="338" text-anchor="middle" class="lbl">Multi-flask receiver ("cow" adapter)</text>
  <line x1="545" y1="344" x2="545" y2="372" class="glass"/><line x1="615" y1="344" x2="615" y2="372" class="glass"/><line x1="685" y1="344" x2="685" y2="372" class="glass"/>
  <circle cx="545" cy="410" r="38" class="glass"/><circle cx="615" cy="410" r="38" class="glass"/><circle cx="685" cy="410" r="38" class="glass"/>
  <path d="M508,418 A38,38 0 0 0 582,418 Z" fill="#a5c8ea"/>
  <text x="545" y="462" text-anchor="middle" class="lbl">Cut 1</text><text x="615" y="462" text-anchor="middle" class="lbl">Cut 2</text><text x="685" y="462" text-anchor="middle" class="lbl">Cut n</text>
  <g stroke="#555" fill="#fff"><circle cx="545" cy="358" r="6"/><circle cx="615" cy="358" r="6"/><circle cx="685" cy="358" r="6"/></g>
  <text x="730" y="362" class="lbl">isolation valves (swap cuts</text><text x="730" y="376" class="lbl">without breaking vacuum)</text>

  <!-- ===== Vacuum train ===== -->
  <path d="M710,333 L790,333 L790,520 L820,520" class="vac" marker-end="url(#arrG)"/>
  <rect x="820" y="490" width="110" height="60" class="box"/>
  <text x="875" y="515" text-anchor="middle" class="lbl">Cold trap</text><text x="875" y="531" text-anchor="middle" class="lbl">(light ends)</text>
  <line x1="930" y1="520" x2="960" y2="520" class="vac" marker-end="url(#arrG)"/>
  <rect x="960" y="495" width="100" height="50" class="box"/>
  <text x="1010" y="516" text-anchor="middle" class="lbl">Vacuum pump</text><text x="1010" y="532" text-anchor="middle" class="lbl">+ controller</text>
  <circle cx="790" cy="440" r="11" fill="#fff" stroke="#555"/><text x="790" y="444" text-anchor="middle" font-size="11">V</text>
  <text x="808" y="436" class="lbl">Bleed / vent valve</text><text x="808" y="450" class="lbl">(vent when at atm.)</text>

  <!-- ===== Legend + note ===== -->
  <rect x="780" y="590" width="300" height="100" class="box" fill="#fafafa"/>
  <text x="790" y="608" font-weight="bold" class="lbl">Legend</text>
  <line x1="790" y1="622" x2="830" y2="622" class="vap"/><text x="838" y="626" class="lbl">Vapour</text>
  <line x1="790" y1="638" x2="830" y2="638" class="liq"/><text x="838" y="642" class="lbl">Liquid (reflux dashed / distillate)</text>
  <line x1="790" y1="654" x2="830" y2="654" class="cw"/><text x="838" y="658" class="lbl">Coolant</text>
  <line x1="790" y1="670" x2="830" y2="670" class="vac"/><text x="838" y="674" class="lbl">Vacuum line</text>
  <line x1="940" y1="622" x2="980" y2="622" class="sig"/><text x="988" y="626" class="lbl">Signal</text>
  <text x="20" y="700" font-style="italic" class="lbl" fill="#555">Static layout, not to scale. The app version scales H_pack, D and pot level from the inputs.</text>
</svg>
